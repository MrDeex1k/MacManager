name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      system_tests:
        description: Run hardware and live integrations on the dedicated trusted Mac
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: ./scripts/verify.sh quick
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: quick-verification
          path: .build/verification/run.*/**/*.log
          retention-days: 7

  ui:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: ./scripts/verify.sh ui
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: ui-verification
          path: .build/verification/run.*/ui.xcresult
          retention-days: 7

  system:
    if: github.event_name == 'workflow_dispatch' && inputs.system_tests
    runs-on: [self-hosted, macOS, ARM64, macmanager-system-tests]
    environment: system-verification
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: ./scripts/verify.sh system
      # System results may contain local device/network metadata. Keep them on
      # the dedicated Mac for redaction; never upload them from this job.
